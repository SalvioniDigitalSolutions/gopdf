name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      # Several tests measure this package against an independent
      # implementation, and several others need a real font file to
      # embed. Both are skipped when absent rather than failing, so
      # installing them is the difference between the suite running and
      # the suite quietly stepping over its most interesting parts.
      - name: Install Poppler and a font
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-dejavu-core

      - name: Install Poppler
        if: matrix.os == 'macos-latest'
        run: brew install poppler

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -timeout 20m

      - name: test -race
        run: go test -race ./... -timeout 30m
